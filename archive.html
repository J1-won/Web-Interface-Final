<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Ballet:opsz@16..72&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* 기본 폰트 및 설정 */
        .arimo { font-family: "Arimo", sans-serif; font-weight: 400; font-style: normal; }
        .arimo-i { font-family: "Arimo", sans-serif; font-weight: 400; font-style: italic;}
        .ballet { font-family: "Ballet", cursive; font-weight: 400; font-style: normal; }
        
        html { font-size: 2rem; scroll-behavior: smooth; font-family: "Arimo", sans-serif; }
        body, h1, h2, h3, p, ul { margin: 0; padding: 0; }
        
        body {
            background-color: #000000;
            overflow-y: auto; 
            overflow-x: hidden;
            
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 60px 45px;
            background-position: -1px -1px;
            background-attachment: fixed;
            width: 100vw; 
            height: 100%;
        }
        
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100vh; z-index: 50; outline: none;
        }
        #canvas-container canvas { background: transparent !important; }

        #labels-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100vh; pointer-events: none; z-index: 60;
        }

        .globe-label {
            position: absolute;
            color: #4cf3ff;
            font-size: 0.8rem; 
            text-align: center;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
        
        #drag-area {
            position: absolute;
            top: 25%;       
            height: 45%;    
            width: 100%;
            z-index: 100;   
            cursor: grab;   
        }
        #drag-area:active { cursor: grabbing; }

        /* 하단 이미지 그리드 */
        #footer-grid {
            position: absolute;
            top: 100vh;        
            left: 0;
            width: 100%;
            height: 60vh;     
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(2, 1fr);    
            z-index: 200;
            background-color: black; 
        }

        .grid-item {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
            background-color: #000;
            text-decoration: none; /* a태그 기본 밑줄 제거 */
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            opacity: 1; 
            transition: opacity 0.3s ease, transform 0.4s ease;
        }

        /* ★ 호버 시 텍스트 스타일 */
        .grid-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4cf3ff;
            font-family: "Arimo", sans-serif;font-style: italic;
            font-size: 0.5rem;
            text-decoration: underline; 
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
            opacity: 0; /* 평소엔 숨김 */
            transition: opacity 0.3s ease;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            width: 100%;
        }

        /* 호버 효과 */
        .grid-item:hover img {
            opacity: 0.4; /* 이미지는 어둡게 */
            transform: scale(1.03);
        }

        .grid-item:hover .grid-text {
            opacity: 1; /* 텍스트는 보이게 */
        }

        #archive-title-container {
            position: absolute; font-size:5.5rem; top: 5%; left: 0; width: 100%; z-index: 150;
            color: white; padding-left: 50px; box-sizing: border-box; pointer-events: none;
        }

        .top-gradient-overlay {
            position: absolute; top: 0;left: 0;width: 100%; height: 55px; z-index: 150;
            background-color: black;
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.5) 0%, rgba(0, 0, 0, 0.3) 90%, rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
        }

        .back-btn {
            position: fixed;
            top: 25px;
            left: 40px;
            color: #4cf3ff;
            font-family: "Arimo", sans-serif; font-weight: 400;
            font-style: italic;
            font-size: 0.6rem;
            text-decoration: none; 
            z-index: 200;
            transition: opacity 0.3s; 
        }
        .back-btn::after {
            content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 1px;
            background-color: #4cf3ff; transition: opacity 0.2s; 
        }
        .back-btn:hover { opacity: 0.9; }
        .back-btn:hover::after { opacity: 0; }
        
        .info-text-container {
            position: absolute; top: 280px; left: 50%; font-family: "Arimo", sans-serif; font-weight: 400;
            font-size: 0.4rem; line-height: 1.3; transform: translateX(-50%); z-index: 200; color: white;
            text-align: center; max-width: 600px; pointer-events: none;
        }
        
        .info-text-container2 {
            position: absolute; 
            top: 92vh; 
            left: 50%; 
            font-family: "Arimo", sans-serif; font-weight: 400;
            font-size: 0.4rem; line-height: 1.3; transform: translateX(-50%); z-index: 200; color: white;
            text-align: center; max-width: 600px; pointer-events: none;
        }

        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <a href="index.html" class="back-btn">back to main</a>
    <div class="top-gradient-overlay"></div>
    
    <div class="bg">
        <h1 id="archive-title-container"><span class="ballet">Archive</span></h1>
        
        <p class="info-text-container">Scroll to explore the earth texture archive.</p>
        
        <p class="info-text-container2">Click the images to see the sources.</p>
    </div>

    <div id="canvas-container"></div>
    <div id="labels-container"></div>
    
    <div id="drag-area"></div>

    <div id="footer-grid">
        <a href="https://www.gdeltproject.org/" target="_blank" class="grid-item">
            <img src="cm_earth_bright.jpg" alt="Source Image 1">
            <span class="grid-text">The GDELT Project</span>
        </a>
        <a href="https://www.cia.gov/the-world-factbook/" target="_blank" class="grid-item">
            <img src="bg.jpg" alt="Source Image 2">
            <span class="grid-text">The World Factbook</span>
        </a>
        <a href="https://www.worldometers.info/" target="_blank" class="grid-item">
            <img src="cm_earth_night.jpg" alt="Source Image 3">
            <span class="grid-text">Worldometer</span>
        </a>
        <a href="https://data.worldbank.org/" target="_blank" class="grid-item">
            <img src="cm_earth_texture.jpg" alt="Source Image 4">
            <span class="grid-text">World Bank Data</span>
        </a>
        <a href="https://ourworldindata.org/grapher/life-expectancy#:~:text=Date%20range" target="_blank" class="grid-item">
            <img src="cm_earth_bw.jpg" alt="Source Image 5">
            <span class="grid-text">World Data Lab</span>
        </a>
        <a href="https://database.earth/" target="_blank" class="grid-item">
            <img src="cm_earth_basic2.jpg" alt="Source Image 6">
            <span class="grid-text">Database.Earth</span>
        </a>
        <a href="https://www.earthdata.nasa.gov/" target="_blank" class="grid-item">
            <img src="cm_earthdd.jpg" alt="Source Image 7">
            <span class="grid-text">EarthData</span>
        </a>
        <a href="https://ourworldindata.org/grapher/share-of-individuals-using-the-internet#:~:text=Date%20range" target="_blank" class="grid-item">
            <img src="cm_earth_clouds.jpg" alt="Source Image 8">
            <span class="grid-text">Our World in Data</span>
        </a>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // 전역 변수
        let scene, camera, renderer;
        const meshes = []; 
        const labels = [];
        let targetScrollX = 0;

        // 드래그 변수
        let isDragging = false;
        let startX = 0;
        let startScrollX = 0;
        let isClick = true; 
        
        const globesData = [
            { name: 'Basic',  texture: 'cm_earth_basic2.jpg' },
            { name: 'Night',  texture: 'cm_earth_night.jpg' },
            { name: 'Wind',  texture: 'cm_earth_bw.jpg' },
            { name: 'Flat',  texture: 'cm_earth_texture.jpg' },
            { name: 'Clouds',  texture: 'cm_earth_clouds.jpg' },
            { name: 'Light',  texture: 'cm_earth_bright.jpg' },
            { name: 'Reverse', texture: 'cm_earthdd.jpg' }
        ];
        
        const gap = 10; 
        const globeRadius = 4;
        const viewSize = 12; 
        const maxScroll = (globesData.length - 1) * gap;

        function init() {
            scene = new THREE.Scene();
            
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.OrthographicCamera(
                -viewSize * aspect, viewSize * aspect,
                viewSize, -viewSize,
                0.1, 1000
            );
            camera.position.set(0, 0, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000, 0); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const textureLoader = new THREE.TextureLoader();
            const globeGroup = new THREE.Group();
            scene.add(globeGroup);
            const labelsContainer = document.getElementById('labels-container');

            globesData.forEach((data, index) => {
                const geometry = new THREE.SphereGeometry(globeRadius, 64, 64);
                const tex = textureLoader.load(data.texture);
                const material = new THREE.MeshBasicMaterial({ 
                    map: tex,
                    color: 0xffffff 
                });
                const sphere = new THREE.Mesh(geometry, material);
                
                sphere.position.x = index * gap;
                sphere.position.y = -2;
                sphere.userData = { id: index, name: data.name };
                
                globeGroup.add(sphere);
                meshes.push(sphere);

                const labelDiv = document.createElement('div');
                labelDiv.className = 'globe-label';
                labelDiv.innerHTML = `<span class="ballet" style="font-size:130%; font-weight:400;">(</span><span class="arimo-i" style="font-size:80%">${data.name}</span><span class="ballet" style="font-size:130%; font-weight:400;">)</span>`;
                labelsContainer.appendChild(labelDiv);
                
                labels.push({ div: labelDiv, mesh: sphere });
            });

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('wheel', onWheel);
            
            const dragArea = document.getElementById('drag-area');
            
            dragArea.addEventListener('mousedown', onMouseDown);
            dragArea.addEventListener('touchstart', onTouchStart);

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('touchmove', onTouchMove);
            window.addEventListener('touchend', onMouseUp);

            animate();
        }

        function onMouseDown(e) { startDrag(e.clientX); }
        function onTouchStart(e) { startDrag(e.touches[0].clientX); }

        function startDrag(clientX) {
            isDragging = true;
            isClick = true;
            startX = clientX;
            startScrollX = targetScrollX;
        }

        function onMouseMove(e) {
            if (!isDragging) return;
            e.preventDefault(); 
            moveDrag(e.clientX);
        }
        function onTouchMove(e) {
            if (!isDragging) return;
            moveDrag(e.touches[0].clientX);
        }

        function moveDrag(clientX) {
            const deltaX = clientX - startX;
            if (Math.abs(deltaX) > 5) {
                isClick = false;
            }
            const aspect = window.innerWidth / window.innerHeight;
            const worldWidth = viewSize * aspect * 2;
            const sensitivity = worldWidth / window.innerWidth;

            targetScrollX = startScrollX - (deltaX * sensitivity);
            targetScrollX = Math.max(0, Math.min(targetScrollX, maxScroll));
        }

        function onMouseUp(e) {
            if (!isDragging) return;
            isDragging = false;
            if (isClick) {
                let clientX, clientY;
                if (e.changedTouches && e.changedTouches.length > 0) {
                     clientX = e.changedTouches[0].clientX;
                     clientY = e.changedTouches[0].clientY;
                } else {
                     clientX = e.clientX;
                     clientY = e.clientY;
                }
                handleGlobeClick(clientX, clientY);
            }
        }

        function onWheel(e) {
            targetScrollX += e.deltaY * 0.01;
            targetScrollX = Math.max(0, Math.min(targetScrollX, maxScroll));
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -viewSize * aspect;
            camera.right = viewSize * aspect;
            camera.top = viewSize;
            camera.bottom = -viewSize;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleGlobeClick(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                console.log(`Clicked: ${intersects[0].object.userData.name}`);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            camera.position.x += (targetScrollX - camera.position.x) * 0.08;

            meshes.forEach(mesh => {
                mesh.rotation.y -= 0.0015;
            });

            labels.forEach(item => {
                const mesh = item.mesh;
                const div = item.div;

                const tempV = new THREE.Vector3(mesh.position.x, mesh.position.y + globeRadius + 0.8, mesh.position.z);
                tempV.project(camera);

                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                div.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                
                const aspect = window.innerWidth / window.innerHeight;
                const dist = Math.abs(mesh.position.x - camera.position.x);
                
                if(dist > viewSize * aspect + 2) { 
                    div.style.display = 'none';
                } else {
                    div.style.display = 'block';
                }
            });

            renderer.render(scene, camera);
        }

        init();

    </script>
</body>
</html>
