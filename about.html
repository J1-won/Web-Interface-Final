<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brief Introduction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Ballet:opsz@16..72&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* 폰트 정의 및 기본 스타일 */
        .arimo { font-family: "Arimo", sans-serif; font-weight: 400; font-style: normal; }
        .arimo-i { font-family: "Arimo", sans-serif; font-weight: 400; font-style: italic;}
        .ballet { font-family: "Ballet", cursive; font-weight: 400; font-style: normal; }
        .noto-sans { font-family: "Noto Sans KR", sans-serif; font-weight: 400; font-style: normal;}
        
        html { font-size: 2rem; scroll-behavior: smooth; font-family: "Arimo", sans-serif; }
        body, h1, h2, h3, p, ol, ul { margin: 0; padding: 0; }
        
        body {
            overflow: hidden; 
            background-color: #000000; 
        }
        canvas { display: block; }

        #about-title-container {
            position: fixed; 
            font-size:5.5rem;
            bottom: -2%; 
            left: 0; 
            width: 100%;
            z-index: 150;
            color: white;
            padding-left: 50px;
            box-sizing: border-box;
            transition: opacity 0.5s;
        }

        #content-display {
            position: fixed; 
            bottom: 50px;
            left: 50px; 
            width: 800px;
            z-index: 150;
            color: white;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #content-display.visible {
            opacity: 1;
        }

        .english-text {
            font-family: arimo;font-weight: 400;
            font-size: 0.75rem;
            margin-bottom: 20px;
            line-height: 1.25;
        }
        .korean-text {
            font-size: 0.7rem; /* 국문 텍스트 크기 */
            margin-bottom: 20px;
            line-height: 1.6;
            word-break: keep-all;
        }
        .city-country {
            text-align: right;padding-right:40px;
            font-size: 0.7rem;
            color: #4cf3ff; /* 도시-국가 괄호 색상 */
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: "Arimo", sans-serif;font-weight: 400;font-style: normal;
            z-index: 100;
        }
        .top-gradient-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100px; z-index: 50;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0) 100%);
        }
        .info-text-container {
            position: fixed; top: 100px; left: 50%; font-family: "Arimo", sans-serif; font-weight: 400;
            font-size: 0.4rem; line-height: 1.3; transform: translateX(-50%); z-index: 200; color: white;
            text-align: center; max-width: 600px;
        }

        .bg {
            position: fixed;
            top: 50px; 
            left: 0;
            width: 100%;
            height: calc(120% - 80px);
            z-index: -1; 
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                linear-gradient(to right, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                url('earth_basic.jpg');
            background-size: 
                cover,    
                60px 45px,  
                60px 45px, 
                cover;       
            background-repeat: no-repeat, repeat, repeat, no-repeat;
            background-position: center, -1px -1px, -1px -1px, center; 
        }

        .map-container {
            position: fixed; 
            top: 50px; 
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
        }

        .lines-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            pointer-events: none;
        }

        .connection-line {
            fill: none;
            stroke: #4cf3ff;
            stroke-width: 1; /* 얇은 두께 유지 */
            stroke-linecap: round;
            opacity: 0.7; 
            /* 초기 Transition 없음 (깜빡임 방지) */
        }
        
        /* JS에서 클래스 추가 시 애니메이션 활성화 */
        .connection-line.animated {
            transition: stroke-dashoffset 0.8s ease-in-out;
        }
        
        .map-point {
            position: absolute;
            display: flex;
            cursor: pointer;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%); 
            pointer-events: auto;
            transition: transform 0.2s;
            width: 50px; 
            height: 50px;
            justify-content: center; 
            z-index: 10;
        }
        
        @keyframes spinY {
            0% { transform: translate(-50%, -50%) rotateY(360deg); }
            100% { transform: translate(-50%, -50%) rotateY(0deg); }
        }
        
        .map-point:hover {
            animation: spinY 3s infinite linear;
            transform-origin: center center;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #4cf3ff; 
            border-radius: 50%;
            z-index: 10;
        }
        .number-label {
            position: absolute;
            top: -15px; 
            color: #4cf3ff;
            font-size: 0.55rem;
            line-height: 1;
            white-space: nowrap;
            z-index: 11;
            user-select: none;
        }
        
        #point-1 { top: 39%; left: 82%; }
        #point-2 { top: 31.1%; left: 46.6%; }
        #point-3 { top: 37%; left: 26.3%; }
        #point-4 { top: 42.8%; left: 55.4%; }
        #point-5 { top: 72.3%; left: 88.3%; }
        #point-6 { top: 66.2%; left: 34.5%; }
        
        .back-btn {
            position: fixed;
            top: 25px;
            left: 40px;
            color: #4cf3ff;
            font-family: "Arimo", sans-serif; font-weight: 400;
            font-style: italic;
            font-size: 0.6rem;
            text-decoration: none; 
            z-index: 200;
            transition: opacity 0.3s; 
        }

        .back-btn::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 1px;
            background-color: #4cf3ff;
            transition: opacity 0.2s; 
        }

        .back-btn:hover {
            opacity: 0.9;
        }
        .back-btn:hover::after {
            opacity: 0; 
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">back to main</a>
    <div class="top-gradient-overlay"></div>
    <div class="bg">
        <h1 id="about-title-container"><span class="ballet">About</span></h1>
        
        <p class="info-text-container">Click the dots in the order of the numbers.</p>
        
        <div id="content-display">
        </div>

        <div class="map-container">
            <svg class="lines-svg" id="lines-layer">
                </svg>

            <div class="map-point" id="point-1" data-index="1">
                <div class="dot"></div>
                <div class="number-label"><span class="ballet" style="font-size: 200%;">(</span><span class="arimo-i">1</span><span class="ballet" style="font-size: 200%;">)</span></div>
            </div>
        
            <div class="map-point" id="point-2" data-index="2">
                <div class="dot"></div>
                <div class="number-label"><span class="ballet" style="font-size: 200%;">(</span><span class="arimo-i">2</span><span class="ballet" style="font-size: 200%;">)</span></div>
            </div>
        
            <div class="map-point" id="point-3" data-index="3">
                <div class="dot"></div>
                <div class="number-label"><span class="ballet" style="font-size: 200%;">(</span><span class="arimo-i">3</span><span class="ballet" style="font-size: 200%;">)</span></div>
            </div>
        
            <div class="map-point" id="point-4" data-index="4">
                <div class="dot"></div>
                <div class="number-label"><span class="ballet" style="font-size: 200%;">(</span><span class="arimo-i">4</span><span class="ballet" style="font-size: 200%;">)</span></div>
            </div>
        
            <div class="map-point" id="point-5" data-index="5">
                <div class="dot"></div>
                <div class="number-label"><span class="ballet" style="font-size: 200%;">(</span><span class="arimo-i">5</span><span class="ballet" style="font-size: 200%;">)</span></div>
            </div>
        
            <div class="map-point" id="point-6" data-index="6">
                <div class="dot"></div>
                <div class="number-label"><span class="ballet" style="font-size: 200%;">(</span><span class="arimo-i">6</span><span class="ballet" style="font-size: 200%;">)</span></div>
            </div>
        </div>
    </div>

    <script>
        const contentData = [
            {
                english: "We’re living in 21st century, where internet is connecting everything.",
                korean: "우리는 인터넷으로 모든 것이 연결된 21세기에 살고 있습니다.",
                city: "Seoul, Korea"
            },
            {
                english: "It weaves invisible threads between cities, people, and information across the globe.",
                korean: "인터넷은 전 세계의 도시, 사람, 정보 사이에 보이지 않는 실을 엮어냅니다.",
                city: "London, UK"
            },
            {
                english: "This webpage visualizes those connections as a living, <br>breathing network.",
                korean: "이 웹페이지는 이러한 연결을 살아 숨 쉬는 네트워크로 시각화합니다.",
                city: "New York, USA"
            },
            {
                english: "You can explore how data flows through our world by interacting <br>with the rotating Earth.",
                korean: "사용자는 회전하는 지구와 상호작용하며 데이터가 우리 세계를 어떻게 <br>흐르는지 탐구할 수 있습니다.",
                city: "Cairo, Egypt"
            },
            {
                english: "Each city is intertwined with a keyword linking this vast <br>digital landscape.",
                korean: "각 도시는 이 방대한 디지털 풍경을 연결하는 키워드로 엮여 있습니다.",
                city: "Sydney, Australia"
            },
            {
                english: "Dive in, follow the links, and experience the planet as an <br>interconnected web.",
                korean: "웹사이트를 탐험하며 지구를 하나의 연결된 웹으로 경험해 보세요.",
                city: "São Paulo, Brazil"
            }
        ];

        let isFirstClick = true;
        let currentActiveIndex = -1; 
        const contentDisplay = document.getElementById('content-display');
        const aboutTitle = document.getElementById('about-title-container');
        const mapPoints = document.querySelectorAll('.map-point');
        const linesLayer = document.getElementById('lines-layer');

        // [수정] 직선(line) 요소 생성 (6->1 포함)
        function initLines() {
            const numPoints = mapPoints.length;
            for (let i = 0; i < numPoints; i++) {
                const nextIndex = (i + 1) % numPoints; // 다음 인덱스 계산 (마지막은 0으로)
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("class", "connection-line");
                line.setAttribute("id", `line-${i}-${nextIndex}`); 
                linesLayer.appendChild(line);
            }
            updateLineCoordinates(); // 좌표 계산

            // 깜빡임 방지 로직 (50ms 후 애니메이션 클래스 추가)
            setTimeout(() => {
                const lines = document.querySelectorAll('.connection-line');
                lines.forEach(l => l.classList.add('animated'));
            }, 50);
        }

        function updateLineCoordinates() {
            const svgRect = linesLayer.getBoundingClientRect();
            const numPoints = mapPoints.length;

            for (let i = 0; i < numPoints; i++) {
                const nextIndex = (i + 1) % numPoints;
                const line = document.getElementById(`line-${i}-${nextIndex}`);
                
                const dot1 = mapPoints[i].querySelector('.dot').getBoundingClientRect();
                const dot2 = mapPoints[nextIndex].querySelector('.dot').getBoundingClientRect();

                // 점의 중심 좌표 계산
                const x1 = dot1.left + dot1.width / 2 - svgRect.left;
                const y1 = dot1.top + dot1.height / 2 - svgRect.top;
                const x2 = dot2.left + dot2.width / 2 - svgRect.left;
                const y2 = dot2.top + dot2.height / 2 - svgRect.top;

                // 직선 좌표 할당
                line.setAttribute("x1", x1);
                line.setAttribute("y1", y1);
                line.setAttribute("x2", x2);
                line.setAttribute("y2", y2);

                // 선 길이 계산 (애니메이션용)
                const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                line.style.strokeDasharray = length;
                
                // [수정] 표시 로직
                // i(선 시작점 인덱스)가 currentActiveIndex 이하이면 표시
                // currentActiveIndex가 -1이면 모두 숨김
                if (currentActiveIndex !== -1 && i <= currentActiveIndex) {
                    line.style.strokeDashoffset = 0; // 보임
                } else {
                    line.style.strokeDashoffset = length; // 숨김
                }
            }
        }

        window.addEventListener('resize', updateLineCoordinates);

        // 초기화
        initLines();

        function createContentHTML(data) {
            return `
                <p class="english-text">${data.english}</p>
                <p class="korean-text noto-sans">${data.korean}</p>
                <div class="city-country">
                    <span class="ballet" style="font-size: 180%;">(</span>
                    <span class="arimo-i">${data.city}</span>
                    <span class="ballet" style="font-size:180%">)</span>
                </div>
            `;
        }

        function handlePointClick(event) {
            const pointElement = event.currentTarget;
            const index = parseInt(pointElement.getAttribute('data-index')) - 1; 

            if (isFirstClick) {
                aboutTitle.style.opacity = '0';
                setTimeout(() => { aboutTitle.style.display = 'none'; }, 500); 
                isFirstClick = false; 
            }

            // 현재 클릭된 인덱스 업데이트
            currentActiveIndex = index;
            updateLineCoordinates(); // 선 상태 업데이트

            // [핵심 수정] 마지막 점(6번, index 5) 클릭 시 이벤트 처리
            if (index === mapPoints.length - 1) {
                // 선이 그려지는 시간(0.8초) + 약간의 여유 시간 후 모든 선 숨기기
                setTimeout(() => {
                    currentActiveIndex = -1; // 초기화
                    updateLineCoordinates(); // 모든 선 숨김 상태로 업데이트
                }, 900); 
            }

            const data = contentData[index];

            contentDisplay.style.opacity = '0'; 
            
            setTimeout(() => {
                contentDisplay.innerHTML = createContentHTML(data);
                contentDisplay.classList.add('visible'); 
                contentDisplay.style.opacity = '1';
            }, 300); 
        }

        mapPoints.forEach(point => {
            point.addEventListener('click', handlePointClick);
        });

    </script>
    
</body>
</html>
